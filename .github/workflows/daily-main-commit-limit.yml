name: Daily main commit limit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    # 00:00 Asia/Jakarta (UTC+7) — re-check open cursor PRs after daily reset
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce-daily-main-commit-limit:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest main
        run: git fetch origin main

      - name: Run unit tests
        run: npm test

      - name: Fetch latest main before limit check
        run: git fetch origin main

      - name: Verify daily commit limit on main
        env:
          GIT_BRANCH: origin/main
          COMMIT_LIMIT_TZ: Asia/Jakarta
          MAIN_DAILY_COMMIT_LIMIT: "5"
          PENDING_MAIN_COMMITS: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          RETROSPECTIVE_CHECK: ${{ github.event_name == 'push' && '1' || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            export GIT_PUSH_TIP="${{ github.sha }}"
            export GIT_PUSH_BASE="${{ github.event.before }}"
            BEFORE="${{ github.event.before }}"
            TIP="${{ github.sha }}"
            ZERO_SHA="0000000000000000000000000000000000000000"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO_SHA" ]; then
              export GIT_PUSH_COMMIT_COUNT="$(git rev-list --count --first-parent "$BEFORE..$TIP")"
            else
              # Always derive zero-base push size from git; event.commits can truncate.
              export GIT_PUSH_COMMIT_COUNT="$(git rev-list --count --first-parent "$ZERO_SHA..$TIP")"
            fi
          fi
          npm run check:main-commit-limit

  midnight-merge-cursor-prs:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge-cursor-pr-main
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest main
        run: git fetch origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Auto-merge eligible cursor PRs after daily reset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_LIMIT_TZ: Asia/Jakarta
          MAIN_DAILY_COMMIT_LIMIT: "5"
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          git fetch origin main
          if ! GIT_BRANCH=origin/main STOP_WHEN_AT_LIMIT=1 npm run --silent check:main-commit-limit; then
            echo "Daily quota exhausted; skipping midnight merge queue."
            exit 0
          fi

          mapfile -t prs < <(
            gh pr list \
              --base main \
              --state open \
              --json number,headRefName,isDraft,headRepositoryOwner \
              --jq 'sort_by(.number) | .[] | select(.headRefName | startswith("cursor/")) | select(.isDraft == false) | select(.headRepositoryOwner.login == $REPO_OWNER) | .number' \
              --arg REPO_OWNER "$REPO_OWNER"
          )

          if ((${#prs[@]} == 0)); then
            echo "No open cursor PRs to merge."
            exit 0
          fi

          for pr in "${prs[@]}"; do
            echo "Checking PR #${pr}..."
            head_sha="$(gh pr view "$pr" --json headRefOid -q .headRefOid)"

            git fetch origin main

            if ! GIT_BRANCH=origin/main PENDING_MAIN_COMMITS=1 npm run --silent check:main-commit-limit; then
              echo "Daily limit reached; stopping midnight merge queue."
              break
            fi

            current_sha="$(gh pr view "$pr" --json headRefOid -q .headRefOid)"
            if [[ "$current_sha" != "$head_sha" ]]; then
              echo "PR #${pr} head moved (${head_sha} -> ${current_sha}); skipping."
              continue
            fi

            head_branch="$(gh pr view "$pr" --json headRefName -q .headRefName)"
            failed_run="$(gh run list \
              --workflow="daily-main-commit-limit.yml" \
              --branch="$head_branch" \
              --status=failure \
              --limit 20 \
              --json databaseId,headSha,conclusion \
              --jq --arg head "$head_sha" \
                '[.[] | select(.headSha == $head) | select(.conclusion == "failure")] | .[0].databaseId // empty' \
              2>/dev/null || true)"
            if [[ -n "$failed_run" ]]; then
              echo "Re-running stale failed limit workflow run ${failed_run} for PR #${pr} at ${head_sha}..."
              gh run rerun "$failed_run" || true
              for _ in $(seq 1 60); do
                run_status="$(gh run view "$failed_run" --json status -q .status 2>/dev/null || echo completed)"
                if [[ "$run_status" != "in_progress" && "$run_status" != "queued" && "$run_status" != "waiting" && "$run_status" != "pending" ]]; then
                  break
                fi
                sleep 10
              done
            fi

            git fetch origin main
            if ! GIT_BRANCH=origin/main PENDING_MAIN_COMMITS=1 npm run --silent check:main-commit-limit; then
              echo "Daily limit reached after rerun wait; stopping midnight merge queue."
              break
            fi
            current_sha="$(gh pr view "$pr" --json headRefOid -q .headRefOid)"
            if [[ "$current_sha" != "$head_sha" ]]; then
              echo "PR #${pr} head moved during rerun wait (${head_sha} -> ${current_sha}); skipping."
              continue
            fi

            if ! gh pr checks "$pr" --required; then
              echo "PR #${pr} required checks not passing; skipping."
              continue
            fi

            git fetch origin main
            if ! GIT_BRANCH=origin/main PENDING_MAIN_COMMITS=1 npm run --silent check:main-commit-limit; then
              echo "Daily limit reached before merge; stopping midnight merge queue."
              break
            fi
            current_sha="$(gh pr view "$pr" --json headRefOid -q .headRefOid)"
            if [[ "$current_sha" != "$head_sha" ]]; then
              echo "PR #${pr} head moved before merge (${head_sha} -> ${current_sha}); skipping."
              continue
            fi

            if ! gh pr merge "$pr" --squash --delete-branch --admin --match-head-commit "$head_sha"; then
              echo "Failed to merge PR #${pr}; continuing queue."
              continue
            fi
            echo "Merged PR #${pr} at ${head_sha}."
            git fetch origin main
          done

  auto-merge-cursor-pr:
    needs: enforce-daily-main-commit-limit
    if: >
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened", "synchronize", "reopened", "ready_for_review"]'), github.event.action) &&
      !github.event.pull_request.merged &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'cursor/') &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge-cursor-pr-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest main
        run: git fetch origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest main before limit check
        run: git fetch origin main

      - name: Re-verify daily commit limit before merge
        env:
          GIT_BRANCH: origin/main
          COMMIT_LIMIT_TZ: Asia/Jakarta
          MAIN_DAILY_COMMIT_LIMIT: "5"
          PENDING_MAIN_COMMITS: "1"
        run: npm run check:main-commit-limit

      - name: Verify PR head SHA before merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected_sha="${{ github.event.pull_request.head.sha }}"
          current_sha="$(gh pr view "${{ github.event.pull_request.number }}" --json headRefOid -q .headRefOid)"
          if [[ "$current_sha" != "$expected_sha" ]]; then
            echo "PR head moved since checks started ($expected_sha -> $current_sha); aborting merge."
            exit 1
          fi

      - name: Verify required checks before merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh pr checks "${{ github.event.pull_request.number }}" --required; then
            echo "Required checks not passing; aborting merge."
            exit 1
          fi

      - name: Final quota check and squash merge cursor PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="${{ github.event.pull_request.number }}"
          expected_sha="${{ github.event.pull_request.head.sha }}"
          git fetch origin main
          if ! GIT_BRANCH=origin/main PENDING_MAIN_COMMITS=1 npm run --silent check:main-commit-limit; then
            echo "Daily limit reached before merge; aborting."
            exit 1
          fi
          current_sha="$(gh pr view "$pr" --json headRefOid -q .headRefOid)"
          if [[ "$current_sha" != "$expected_sha" ]]; then
            echo "PR head moved before merge ($expected_sha -> $current_sha); aborting."
            exit 1
          fi
          gh pr merge "$pr" \
            --squash \
            --delete-branch \
            --admin \
            --match-head-commit "$expected_sha"
