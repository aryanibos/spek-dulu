name: Daily main commit limit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce-daily-main-commit-limit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Verify daily commit limit on main
        env:
          GIT_BRANCH: main
          COMMIT_LIMIT_TZ: Asia/Jakarta
          MAIN_DAILY_COMMIT_LIMIT: "5"
          PENDING_MAIN_COMMITS: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: npm run check:main-commit-limit

  auto-merge-cursor-pr:
    needs: enforce-daily-main-commit-limit
    if: >
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'cursor/') &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge-cursor-pr-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest main
        run: git fetch origin main:main

      - name: Re-verify daily commit limit before merge
        env:
          GIT_BRANCH: main
          COMMIT_LIMIT_TZ: Asia/Jakarta
          MAIN_DAILY_COMMIT_LIMIT: "5"
          PENDING_MAIN_COMMITS: "1"
        run: npm run check:main-commit-limit

      - name: Squash merge cursor PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --squash \
            --delete-branch \
            --admin
